<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product</title>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #0a0a0a; color: black;">
    <a href="search.html" style="color: white; text-decoration: underline;">Back</a>
    <h1 id="product-name" style="color: white">Loading...</h1>
    <img id="product-image" src="" alt="no product image" style="max-width: 200px;">
    
    <div id="edit-form">
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Product ID</label>
            <input type="text" id="id" readonly style="width: 90%; padding: 8px; background: #eee;">
        </div>
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Product Name</label>
            <input type="text" id="name" oninput="handleNameInput()" style="width: 90%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Type</label>
            <input type="text" id="type" style="width: 90%; padding: 8px;">
        </div> 
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Release Date</label>
            <input type="date" id="date" style="width: 90%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">TCGPlayer ID</label>
            <input type="text" id="tcgplayer_id" style="width: 90%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Cardmarket ID</label>
            <input type="text" id="cardmarket_id" style="width: 90%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">CardTrader ID</label>
            <input type="text" id="cardtrader_id" style="width: 90%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Image URL</label>
            <input type="text" id="image_url" style="width: 90%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Description</label>
            <input type="text" id="description" style="width: 90%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Packs (Format: {"sv1": 5,"sv2": 2})</label>
            <input type="text" id="packs" style="width: 90%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Coins (Format: [{"id":"1","size":"big","pokemon":"Mew"}])</label>
            <textarea id="coins" style="width: 90%; padding: 8px;"></textarea>
        </div>
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Sleeves (Comma separated)</label>
            <input type="text" id="sleeves" style="width: 90%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Damage Markers</label>
            <input type="text" id="damage_markers" style="width: 90%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Promos (Comma separated IDs)</label>
            <input type="text" id="promos" style="width: 90%; padding: 8px;">
        </div>
        <div style="margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Other Items</label>
            <textarea id="other" style="width: 90%; padding: 8px;"></textarea>
        </div>
        <button onclick="generateJson()" style="background: white; padding: 10px 20px; border: none; cursor: pointer; font-size: 16px; font-weight: bold;">Save Product Changes</button>
    </div>

    <pre id="json-output" style="background: #333; padding: 10px; margin-top: 20px; display: none; color: white;"></pre>

    <script>
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');
        let allProducts = [];
        let originalProductId = productId;

        function slugifyProductName(name) {
            return String(name || "")
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        function generateUniqueProductId(name, currentId = null) {
            const baseId = slugifyProductName(name);
            if (!baseId) return "";

            const existingIds = new Set(
                allProducts
                    .filter(product => product.id !== currentId)
                    .map(product => product.id)
                    .filter(Boolean)
            );
            if (!existingIds.has(baseId)) return baseId;

            let suffix = 2;
            while (existingIds.has(`${baseId}-${suffix}`)) {
                suffix += 1;
            }
            return `${baseId}-${suffix}`;
        }

        function handleNameInput() {
            const nameValue = document.getElementById('name').value;
            document.getElementById('product-name').innerText = nameValue || 'Product';
            document.getElementById('id').value = generateUniqueProductId(nameValue, originalProductId);
        }

        async function loadProduct() {
            try {
                const response = await fetch('products.json');
                const products = await response.json();
                allProducts = Array.isArray(products) ? products : [];
                const p = products.find(product => product.id === productId);

                if (!p) {
                    document.getElementById('product-name').innerText = "Product not found";
                    return;
                }

                originalProductId = p.id || productId;
                document.getElementById('product-name').innerText = p.name;
                document.getElementById('id').value = p.id || productId || "";
                document.getElementById('name').value = p.name || "";
                document.getElementById('type').value = p.type || "";
                document.getElementById('date').value = p.release_date || "";
                document.getElementById('product-image').src = p.image_url;
                document.getElementById('tcgplayer_id').value = p.tcgplayer_id || "";
                document.getElementById('cardmarket_id').value = p.cardmarket_id || "";
                document.getElementById('cardtrader_id').value = p.cardtrader_id || "";
                document.getElementById('description').value = p.description || "";
                document.getElementById('image_url').value = p.image_url || "";
                document.getElementById('packs').value = JSON.stringify(p.packs || {});
                document.getElementById('coins').value = JSON.stringify(p.coins || [], null, 2);
                document.getElementById('sleeves').value = p.sleeves ? p.sleeves.join(', ') : "";
                document.getElementById('damage_markers').value = p.damage_markers || "";
                document.getElementById('promos').value = p.promos ? p.promos.join(', ') : "";
                document.getElementById('other').value = p.other || "";
                handleNameInput();
            } catch (e) {
                console.error("Error loading product:", e);
            }
        }

        async function generateJson() {
            try {
                const updated = {
                    id: generateUniqueProductId(document.getElementById('name').value, originalProductId) || productId,
                    name: document.getElementById('name').value,
                    type: document.getElementById('type').value,
                    release_date: document.getElementById('date').value,
                    tcgplayer_id: document.getElementById('tcgplayer_id').value,
                    cardmarket_id: document.getElementById('cardmarket_id').value,
                    cardtrader_id: document.getElementById('cardtrader_id').value,
                    description: document.getElementById('description').value,
                    image_url: document.getElementById('image_url').value,
                    packs: JSON.parse(document.getElementById('packs').value || '{}'),
                    coins: JSON.parse(document.getElementById('coins').value || '[]'),
                    sleeves: document.getElementById('sleeves').value.split(',').map(s => s.trim()).filter(s => s !== ""),
                    damage_markers: document.getElementById('damage_markers').value,
                    promos: document.getElementById('promos').value.split(',').map(s => s.trim()).filter(s => s !== ""),
                    other: document.getElementById('other').value
                };
                
                const isLocal = window.location.hostname === 'localhost';

                if (isLocal) {
                    const response = await fetch('http://localhost:3000/update-products', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ...updated, original_id: originalProductId })
                    });

                    if (response.ok) {
                    } else {
                        alert("Server error while saving.");
                    }
                } else {
                    const output = document.getElementById('json-output');
                    output.style.display = 'block';
                    output.innerText = JSON.stringify(updated, null, 2);
                }
            } catch (e) {
                alert("Invalid JSON format in Packs or Coins");
                console.error(e);
            }
        }

        loadProduct();
    </script>
</body>
</html>
